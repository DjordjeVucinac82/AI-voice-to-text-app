version: "3.9"
services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file:
      - .env
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV}
      MODEL_DEFAULT: ${MODEL_DEFAULT}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      API_KEY: ${API_KEY}
      STORAGE_DIR: ${STORAGE_DIR}
    volumes:
      - ../data/uploads:${STORAGE_DIR}/uploads
      - ../data/results:${STORAGE_DIR}/results
      - ../data/logs:${STORAGE_DIR}/logs
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      MODEL_DEFAULT: ${MODEL_DEFAULT}
      STORAGE_DIR: ${STORAGE_DIR}
    volumes:
      - ../data/uploads:${STORAGE_DIR}/uploads
      - ../data/results:${STORAGE_DIR}/results
      - ../data/logs:${STORAGE_DIR}/logs
    restart: unless-stopped
